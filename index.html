<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLORA 花艺 · 低保真交互原型</title>
<style>
  :root{
    --paper:#EDE9E1;
    --screen:#F8F6F1;
    --ink:#3A3632;
    --ink2:#8A8379;
    --ink3:#B4ACA0;
    --line:#D9D2C6;
    --box:#E7E1D6;
    --box2:#DAD3C6;
    --accent:#C79A7C;
    --serif:"Songti SC","Noto Serif SC","STSong",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:14px}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#C9C1B4;border-radius:3px}

  .tophead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#F7F4EE;position:sticky;top:0;z-index:50}
  .th-t{font-family:var(--serif);font-size:17px;font-weight:500}
  .th-sub{font-family:var(--sans);font-size:12px;color:var(--ink2);font-weight:400;margin-left:8px}
  .th-btn{font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:#fff}
  .th-btn:hover{border-color:var(--accent);color:var(--accent)}

  .layout{display:flex;align-items:flex-start}
  .sidebar{width:268px;flex-shrink:0;background:#FBF9F4;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 14px 30px}
  .side-t{font-size:13px;font-weight:600;padding:0 8px 10px;color:var(--ink2)}
  .sm-gt{font-size:11px;letter-spacing:.08em;color:var(--ink3);padding:12px 8px 4px}
  .sm-item{display:block;width:100%;font-size:13px;padding:7px 10px;border-radius:8px;color:var(--ink)}
  .sm-item:hover{background:#F0EBE2}
  .sm-item.cur{background:rgba(199,154,124,.16);color:var(--accent);font-weight:600}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;gap:12px}
  .stage-hint{font-size:12px;color:var(--ink2)}

  /* 手机 · 402px 设计稿 */
  .phone{width:402px;background:var(--screen);border-radius:44px;box-shadow:0 24px 70px rgba(58,54,50,.22);overflow:hidden;border:7px solid #2E2A26;flex-shrink:0;display:flex;flex-direction:column}
  .screen{height:812px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:var(--screen)}

  /* 状态栏 62px */
  .status{height:62px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 10px;font-size:14px;font-weight:600}
  .status .sr{display:flex;gap:6px;font-size:11px;letter-spacing:1px}

  .topbar{display:flex;align-items:center;gap:8px;padding:6px 16px 12px;flex-shrink:0}
  .topbar .brand{font-family:var(--serif);font-size:18px;font-weight:500;flex:1}
  .topbar .ttl{flex:1;font-size:16px;font-weight:600;text-align:center}
  .topbar .nb{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;border-radius:50%}
  .topbar .sp{flex:1}
  .search{flex:1;height:32px;border-radius:99px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;color:var(--ink3);font-size:12px}
  .cartico{position:relative;width:32px;height:32px;font-size:17px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cartico .b{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:99px;background:var(--accent);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}

  .body{flex:1;padding:4px 16px 20px}

  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
  .sec-t{font-family:var(--serif);font-size:16px;font-weight:500}
  .sec-m{font-size:12px;color:var(--ink2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .links{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}

  .img{background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(138,131,121,.10) 9px 10px),linear-gradient(var(--box),var(--box2));border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9F968A;font-size:11px;letter-spacing:.04em;text-align:center}
  .img span{opacity:.9}
  .r1{aspect-ratio:1/1}.r45{aspect-ratio:4/5}.r169{aspect-ratio:16/9}.r21{aspect-ratio:2/1}

  .btn{display:flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:99px;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
  .btn.obtn{background:#fff;color:var(--ink);border:1px solid var(--ink)}
  .btn.sm{height:32px;font-size:13px;padding:0 16px}
  .btn.grow{flex:1}
  .btn.danger{background:#fff;color:#A0522D;border:1px solid #C9A28F}

  .chiprow{display:flex;flex-wrap:wrap;gap:8px}
  .chip{height:30px;padding:0 14px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .pcard{display:flex;flex-direction:column;gap:6px;width:100%}
  .pcard .img{width:100%}
  .pc-nm{font-size:13px;font-weight:600}
  .pc-tg{font-size:10px;color:var(--ink2);align-self:flex-start;border:1px solid var(--line);border-radius:99px;padding:1px 8px}
  .pc-pr{font-size:15px;font-weight:600}

  .catcard{display:flex;flex-direction:column;gap:6px;width:100%}
  .catcard .img{width:100%}
  .cat-nm{font-size:12px;font-weight:600}

  .pal{display:flex;flex-direction:column;gap:8px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .pal .ps{display:flex;gap:6px;flex-wrap:wrap}
  .pal .pn{font-size:12px;font-weight:600}
  .pal .pact{font-size:11px;color:var(--accent)}

  .banner{position:relative;margin-bottom:6px}
  .banner .img{width:100%}
  .bn-ov{position:absolute;left:0;right:0;bottom:0;padding:14px;color:#fff;background:linear-gradient(transparent,rgba(40,36,32,.55));border-radius:0 0 12px 12px;display:flex;flex-direction:column;gap:2px}
  .bn-ov b{font-family:var(--serif);font-size:15px;font-weight:500}
  .bn-ov span{font-size:11px;opacity:.9}

  .link{display:flex;align-items:center;width:100%;padding:13px 14px;border-bottom:1px solid var(--line);background:#fff;font-size:14px}
  .link:last-child{border-bottom:none}
  .lk-t{flex:1}.lk-s{font-size:12px;color:var(--ink2);margin-right:8px}.lk-a{color:var(--ink3);font-size:16px}

  .field{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff;font-size:13px}
  .field:last-child{border-bottom:none}
  .fd-l{color:var(--ink2);flex-shrink:0}.fd-v{text-align:right}

  .sw{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink2)}
  .sw-c{width:40px;height:40px;border-radius:10px;border:1px solid var(--line)}

  .steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--ink3);padding:2px 0}
  .steps .st{white-space:nowrap}
  .steps .st.cur{color:var(--ink);font-weight:700}
  .steps .st.done{color:var(--ink2)}
  .steps .st-arrow{color:var(--ink3)}

  .tag{font-size:10px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;display:inline-block}
  .badge{font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:99px;padding:2px 10px;display:inline-block}
  .badge.warn{background:#B98A5E}

  .tabbar{display:flex;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
  .tabbar .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:10px;color:var(--ink2)}
  .tabbar .tic{width:22px;height:22px;border-radius:6px;background:var(--box2);border:1px solid var(--line)}
  .tabbar .t.on{color:var(--accent);font-weight:600}
  .tabbar .t.on .tic{background:var(--accent);border-color:var(--accent)}

  /* Home Indicator 34px */
  .homeind{height:34px;flex-shrink:0;background:var(--screen);display:flex;align-items:center;justify-content:center;padding-top:8px}
  .homeind .bar{width:134px;height:5px;border-radius:99px;background:#2E2A26}

  .actbar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;align-items:center}

  .note{font-size:11px;color:var(--ink3);background:#F0EBE2;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
  .suc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:50px 20px;text-align:center}
  .suc .ck{width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
  .suc b{font-family:var(--serif);font-size:17px}
  .suc span{font-size:12px;color:var(--ink2)}
  .muted{color:var(--ink2);font-size:12px}
  .h3{font-size:13px;font-weight:600;margin:14px 0 8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}

  .d3{display:flex;flex-direction:column;gap:10px}
  .d3ctl{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px}
  .d3ctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}

  @media (max-width:820px){
    .sidebar{position:fixed;left:-280px;top:0;z-index:100;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
    .sidebar.open{left:0}
    .phone{width:100%;max-width:402px}
    .screen{height:82vh;min-height:600px}
  }
</style>
</head>
<body>

<div class="tophead">
  <div class="th-t">FLORA 花艺<span class="th-sub">低保真原型 · 4 Tab · 402px · 16px 边距 · 4px 网格</span></div>
  <div class="th-actions">
    <button class="th-btn" onclick="toggleMap()">页面地图</button>
    <button class="th-btn" onclick="tab('home')">回首页</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-t">📋 页面地图（点任意页面跳转）</div>
    <div id="sitemap"></div>
  </aside>

  <div class="stage">
    <div class="stage-hint">↓ 点击手机里的元素跳转页面；灰色斜纹 = 图片占位；定制状态可用「模拟流转」体验</div>
    <div class="phone">
      <div class="screen" id="screen"></div>
    </div>
  </div>
</div>

<script>
/* ================= 工具 ================= */
function statusBar(){ return `<div class="status"><span>9:41</span><span class="sr">●●● 5G ▮▮▮</span></div>`; }
function homeInd(){ return `<div class="homeind"><div class="bar"></div></div>`; }
function cartIcon(){ return `<button class="cartico" onclick="go('cart')">🛒<span class="b">2</span></button>`; }

function navBar(title, opt){
  opt = opt || {};
  var left = (opt.back === false) ? `<span class="brand">FLORA · 花艺</span>` : `<button class="nb" onclick="back()">‹</button>`;
  var right = opt.cart ? cartIcon() : `<span class="sp" style="width:32px"></span>`;
  return `<div class="topbar">${left}<span class="ttl">${title||''}</span>${right}</div>`;
}
function search(ph){ return `<button class="search" onclick="go('shop')">${ph||'搜索花束 / 花材'}</button>`; }
function sec(title, more){ return `<div class="sec"><span class="sec-t">${title}</span>${more?`<button class="sec-m" onclick="${more}">查看全部 ›</button>`:''}</div>`; }
function btn(label, onclick, cls){ return `<button class="btn ${cls||''}" onclick="${onclick}">${label}</button>`; }
function obtn(label, onclick){ return `<button class="btn obtn ${arguments[2]||''}" onclick="${onclick}">${label}</button>`; }
function chip(label, on){ return `<button class="chip ${on?'on':''}" onclick="this.classList.toggle('on')">${label}</button>`; }
function tag(t){ return `<span class="tag">${t}</span>`; }
function img(label, r, h){ return `<div class="img ${r||''}" ${h?`style="height:${h}px"`:''}><span>▦ ${label||'图片'}</span></div>`; }
function pcard(name, price, tg, target){ return `<button class="pcard" onclick="go('${target}')">${img(tg||'花束','r45','')}<span class="pc-nm">${name}</span><span class="pc-tg">${tg}</span><span class="pc-pr">${price}</span></button>`; }
function catCard(name, target){ return `<button class="catcard" onclick="go('${target}')">${img(name,'r1','')}<span class="cat-nm">${name}</span></button>`; }
function link(label, sub, onclick){ return `<button class="link" onclick="${onclick}"><span class="lk-t">${label}</span>${sub?`<span class="lk-s">${sub}</span>`:''}<span class="lk-a">›</span></button>`; }
function field(label, val){ return `<div class="field"><span class="fd-l">${label}</span><span class="fd-v">${val||'—'}</span></div>`; }
function swatch(name, hex){ return `<span class="sw"><span class="sw-c" style="background:${hex}"></span><span class="sw-n">${name}</span></span>`; }
function actionbar(html){ return `<div class="actbar">${html}</div>`; }
function steps(arr, cur){ return `<div class="steps">${arr.map(function(s,i){ return `<span class="st ${i<cur?'done':i===cur?'cur':''}">${i+1} ${s}</span>${i<arr.length-1?'<span class="st-arrow">›</span>':''}`; }).join('')}</div>`; }
function tabbar(active){
  var tabs=[['home','首页'],['shop','选花'],['customize','定制'],['profile','我的']];
  return `<div class="tabbar">${tabs.map(function(t){ return `<button class="t ${t[0]===active?'on':''}" onclick="tab('${t[0]}')"><span class="tic"></span>${t[1]}</button>`; }).join('')}</div>`;
}

/* ================= 定制状态机（演示用全局阶段） ================= */
var CSTAGE = 0; // 0待商家评估 1已接单待启动 2制作中 3待确认方案 4待付材料费 5已完成
var CSTAGES = ['待商家评估','已接单 · 待确认启动','制作中','待确认方案','待付材料费','已完成'];
function nextStage(){ CSTAGE = Math.min(5, CSTAGE+1); render(); }

/* ================= 屏幕 ================= */
var SCREENS = {

  /* ---------- 首页 ---------- */
  home: function(){
    return statusBar() + navBar('', {back:false, cart:true}) +
    `<div class="body">
      <div class="banner" onclick="go('shop')">
        ${img('品牌主视觉 · 当季主题','r21',132)}
        <div class="bn-ov"><b>把一束花，送成一整个季节</b><span>精品热销 ›</span></div>
      </div>
      <button class="pal" onclick="go('customize')" style="flex-direction:row;align-items:center;gap:12px;margin:12px 0">
        <span class="sw-c" style="background:var(--box2)">📷</span>
        <span style="flex:1"><span style="font-weight:600;display:block">上传参考图</span><span class="muted">上传一张图，定制属于你的花</span></span>
        <span style="color:var(--ink3)">›</span>
      </button>
      ${sec('视觉灵感')}
      <div class="grid2">
        <button class="pal" onclick="go('inspiration-color')"><span class="pn">色彩灵感</span><span class="ps">${swatch('复古蓝','#93A3AE')}${swatch('干粉','#D4A9A2')}${swatch('暖白','#F2EDE4')}</span><span class="pact">用这套色彩定制 ›</span></button>
        <button class="pal" onclick="go('inspiration-style')"><span class="pn">风格灵感</span><span class="ps">${swatch('复古','#C79A7C')}${swatch('自然','#9CA98C')}${swatch('简约','#D8C7B0')}</span><span class="pact">用这种风格定制 ›</span></button>
      </div>
      ${sec('定制服务')}
      <button class="pal" onclick="go('customize')" style="flex-direction:row;align-items:center;gap:12px">
        <span style="flex:1"><span style="font-weight:600;display:block">花艺定制服务</span><span class="muted">选花材 → 花艺师制作 → 3D 预览确认</span></span>
        <span style="color:var(--ink3)">›</span>
      </button>
      ${sec('精品热销',"go('shop')")}
      <div class="grid2">
        ${pcard('温柔纪事','¥299','节日','product-detail')}
        ${pcard('毕业快乐','¥259','毕业','product-detail')}
      </div>
    </div>` + tabbar('home') + homeInd();
  },

  'inspiration-color': function(){
    return statusBar() + navBar('色彩灵感') +
    `<div class="body">
      <div class="chiprow">${chip('单色系')}${chip('撞色搭配')}${chip('季节色彩')}${chip('情绪色彩')}</div>
      ${sec('色彩搭配方案')}
      <div class="grid2">
        <button class="pal" onclick="go('customize')"><span class="pn">复古蓝调</span><span class="ps">${swatch('复古蓝','#93A3AE')}${swatch('银灰','#C9C2B6')}${swatch('暖白','#F2EDE4')}</span><span class="pact">用这套色彩定制 ›</span></button>
        <button class="pal" onclick="go('customize')"><span class="pn">浪漫粉调</span><span class="ps">${swatch('干粉','#D4A9A2')}${swatch('粉','#E8C4C4')}${swatch('白','#FBF7F2')}</span><span class="pact">用这套色彩定制 ›</span></button>
        <button class="pal" onclick="go('customize')"><span class="pn">燕麦暖阳</span><span class="ps">${swatch('米杏','#D8C7B0')}${swatch('奶油','#F1E8D8')}${swatch('金','#C4A873')}</span><span class="pact">用这套色彩定制 ›</span></button>
        <button class="pal" onclick="go('customize')"><span class="pn">鼠尾草绿</span><span class="ps">${swatch('鼠尾草','#9CA98C')}${swatch('白','#F8F6F1')}${swatch('灰绿','#B6BFA9')}</span><span class="pact">用这套色彩定制 ›</span></button>
      </div>
    </div>` + tabbar('home') + homeInd();
  },

  'inspiration-style': function(){
    return statusBar() + navBar('风格灵感') +
    `<div class="body">
      <div class="chiprow">${chip('复古风')}${chip('自然风')}${chip('浪漫风')}${chip('极简风')}${chip('个性混搭')}</div>
      ${sec('风格')}
      <div class="grid2">
        <button class="pal" onclick="go('customize')"><span class="pn">复古 Vintage</span><span class="muted">低饱和、做旧、故事感</span><span class="pact">用这种风格定制 ›</span></button>
        <button class="pal" onclick="go('customize')"><span class="pn">自然野趣</span><span class="muted">绿意、松散、田野感</span><span class="pact">用这种风格定制 ›</span></button>
        <button class="pal" onclick="go('customize')"><span class="pn">浪漫柔粉</span><span class="muted">粉调、柔美、仪式感</span><span class="pact">用这种风格定制 ›</span></button>
        <button class="pal" onclick="go('customize')"><span class="pn">极简白绿</span><span class="muted">留白、克制、高级感</span><span class="pact">用这种风格定制 ›</span></button>
      </div>
    </div>` + tabbar('home') + homeInd();
  },

  /* ---------- 选花 ---------- */
  shop: function(){
    return statusBar() + navBar('选花', {back:false, cart:true}) +
    `<div class="body">
      ${search('搜索花束 / 花材')}
      ${sec('商品分类')}
      <div class="grid2">
        ${catCard('精品热销','shop-list')}
        ${catCard('节日花礼','shop-list')}
        ${catCard('毕业快乐','shop-list')}
        ${catCard('手捧花礼','shop-list')}
        ${catCard('永生花 · 干花','shop-list')}
        ${catCard('花盒 · 花篮','shop-list')}
        ${catCard('表白花礼','shop-list')}
        ${catCard('日常花礼','shop-list')}
      </div>
      ${sec('全部商品',"go('shop-list')")}
      <button class="btn grow" onclick="go('shop-list')">立即买 →</button>
      ${sec('精品热销')}
      <div class="grid2">
        ${pcard('温柔纪事','¥299','节日','product-detail')}
        ${pcard('毕业快乐','¥259','毕业','product-detail')}
      </div>
    </div>` + tabbar('shop') + homeInd();
  },

  'shop-list': function(){
    return statusBar() + navBar('商品列表') +
    `<div class="body">

/* ================= 导航 ================= */
var stack = ['home'];
var TAB_ROOT = {home:'home', shop:'shop', customize:'customize', profile:'profile'};
function go(id){ if(!SCREENS[id]) return; stack.push(id); render(); }
function back(){ if(stack.length>1){ stack.pop(); render(); } }
function tab(t){ stack=[TAB_ROOT[t]||'home']; render(); }
function toggleMap(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ================= 站点地图 ================= */
var SITEMAP = [
  {t:'首页 Home', items:[['home','首页'],['inspiration-color','色彩灵感'],['inspiration-style','风格灵感']]},
  {t:'选花 Shop', items:[['shop','选花首页（8 分类）'],['shop-list','商品列表'],['product-detail','商品详情']]},
  {t:'定制 Customize', items:[['customize','定制首页'],['customize-materials','花材选择'],['customize-estimate','费用预估'],['customize-submit','提交定制申请'],['customize-detail','定制申请详情/状态'],['customize-start','确认启动·付服务费'],['preview3d','3D 方案预览'],['material-confirm','材料费确认']]},
  {t:'我的 Profile', items:[['profile','我的'],['orders','我的订单'],['order-detail','订单详情'],['favorites','收藏'],['service','客服与售后'],['settings','账号设置']]},
  {t:'购物车（右上角）', items:[['cart','购物车'],['checkout','结算'],['pay','支付'],['pay-success','支付结果']]}
];

function renderSitemap(){
  var html='';
  SITEMAP.forEach(function(g){
    html += '<div class="sm-group"><div class="sm-gt">'+g.t+'</div>';
    g.items.forEach(function(it){ html += '<button class="sm-item" data-id="'+it[0]+'" onclick="go(\''+it[0]+'\')">'+it[1]+'</button>'; });
    html += '</div>';
  });
  document.getElementById('sitemap').innerHTML = html;
}

function render(){
  var id = stack[stack.length-1];
  var el = document.getElementById('screen');
  el.innerHTML = SCREENS[id]();
  el.scrollTop = 0;
  document.querySelectorAll('.sm-item').forEach(function(n){ n.classList.toggle('cur', n.dataset.id===id); });
  var cur = document.querySelector('.sm-item.cur');
  if(cur && cur.scrollIntoView){ cur.scrollIntoView({block:'nearest'}); }
}

renderSitemap();
render();
